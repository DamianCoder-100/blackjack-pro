<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="blackJackPro.css">
</head>

<body>
    <div class="stars-container" id="stars-bg"></div>
    
    <div class="app-shell game-container container-fluid p-2 p-md-4">
        
        <header class="header mb-3">
            <div class="header-top d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="h3 h1-md">Blackjack Pro</h1>
                    <p class="small text-muted mb-0">Play a quick round against the dealer. Bet with chips and watch the deck reshuffle only when 15 cards remain.</p>
                </div>
                <div class="theme-switcher ms-2">
                    <button id="theme-toggle" class="btn btn-link p-0" type="button" aria-label="Toggle theme">
                        <img id="theme-icon" src="pictures/moon1319.png" alt="Toggle theme">
                    </button>
                </div>
            </div>
        </header>

        <main class="game-board row g-3 mb-3">
            <section class="hand-panel dealer-panel col-12 col-md-6 text-center">
                <div class="p-3 border rounded h-100 bg-dark bg-opacity-25">
                    <h2>Dealer</h2>
                    <div id="dealer-cards" class="cards my-3"></div>
                    <div class="score fw-bold">Score: <span id="dealer-score">0</span></div>
                </div>
            </section>
            
            <section class="hand-panel player-panel col-12 col-md-6 text-center">
                <div class="p-3 border rounded h-100 bg-dark bg-opacity-25">
                    <h2>You</h2>
                    <div id="player-cards" class="cards my-3"></div>
                    <div class="score fw-bold">Score: <span id="player-score">0</span></div>
                </div>
            </section>
        </main>

        <section class="betting text-center mb-3 p-3 border rounded">
            <div class="bet-info d-flex justify-content-around mb-3 fs-5">
                <div class="wallet">Bankroll: <strong id="balance-display" class="text-success">$1000.00</strong></div>
                <div class="wallet">Current Bet: <strong id="bet-display" class="text-warning">$0.00</strong></div>
            </div>
            
            <div class="chip-tray" id="chip-buttons">
                <div class="chip chip-5" data-value="5">
                    <div class="chip-face">$5</div>
                </div>
                <div class="chip chip-10" data-value="10">
                    <div class="chip-face">$10</div>
                </div>
                <div class="chip chip-25" data-value="25">
                    <div class="chip-face">$25</div>
                </div>
                <div class="chip chip-50" data-value="50">
                    <div class="chip-face">$50</div>
                </div>
                <div class="chip chip-100" data-value="100">
                    <div class="chip-face">$100</div>
                </div>
                <div class="chip chip-clear" data-value="clear">
                    <div class="chip-face">CLR</div>
                </div>
            </div>
        </section>

        <section class="controls text-center p-3 border rounded">
            <div class="button-row mb-3">
                <button id="deal-btn" class="btn btn-primary" disabled>Deal</button>
                <button id="hit-btn" class="btn btn-success" disabled>Hit</button>
                <button id="stand-btn" class="btn btn-danger" disabled>Stand</button>
                <button id="reset-btn" class="btn btn-secondary">Reset</button>
            </div>

            <div class="volume-control d-flex align-items-center justify-content-center gap-2 mb-3 mx-auto" style="max-width: 300px;">
                <span id="volume-icon">🔊</span>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5" aria-label="Volume Slider">
                <span id="volume-pct">50%</span>
            </div>

            <div class="status">
                <p id="message" class="mb-0 fw-semibold">Select chips to set your bet, then press Deal.</p>
            </div>
        </section>

        <img src="pictures/car&wheels.png" id="driving-car" class="driving-car" alt="car">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="blackJackPro.js"></script>
</body>

</html>
